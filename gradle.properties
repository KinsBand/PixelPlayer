# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
APP_VERSION_NAME=1.0.0
APP_VERSION_CODE=10
org.gradle.configuration-cache=true
org.gradle.caching=true
# Adjusted to stay within 3GB limit and avoid thrashing
# Increased heap to 4GB and Metaspace to 1024m to prevent memory exhaustion
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:+ParallelRefParsingEnabled
org.gradle.workers.max=6
org.gradle.parallel=true

androidx.benchmark.suppressErrors=EMULATOR,LOW-BATTERY,THERMAL

# R8 Full Mode is generally recommended to be enabled unless there are specific issues.
# android.enableR8.fullMode=false

# Aligning with AGP 9.2+ defaults and removing deprecated settings
# Transitional flag: AGP 9.x requires globally-unique Android namespaces across all
# dependencies. com.google.ai.edge.litert:litert:1.4.2 transitively pulls litert-api:1.4.2
# and both AARs declare the same namespace (known upstream LiteRT bug #6965, no planned fix).
# This disables the unique-namespace enforcement so the manifest merger succeeds.
android.uniquePackageNames=false
android.sdk.defaultTargetSdkToCompileSdkIfUnset=true
android.enableAppCompileTimeRClass=true
android.usesSdkInManifest.disallowed=true
android.r8.optimizedResourceShrinking=true
android.defaults.buildfeatures.resvalues=false

# Cleanup of other non-essential/deprecated flags
android.dependency.useConstraints=false
android.r8.strictFullModeForKeepRules=true

android.builtInKotlin=true
android.newDsl=true
ksp.useKSP2=true

# Workaround for AGP 9.2.1 PathLocator conflict: Android Studio injects both
# ANDROID_PREFS_ROOT and ANDROID_USER_HOME, which AGP flags as a conflict.
# This init script strips ANDROID_PREFS_ROOT before AGP reads the env.
org.gradle.init.script=gradle/init-android-prefs.gradle



# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
